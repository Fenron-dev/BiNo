name: bino_bit_notes
description: "BiNo - Bit Notes. Eine schnelle, lokale Personal-Capture-App im WhatsApp-Stil."
publish_to: 'none'

# Phase 1 = 0.1.0. Semantic Versioning: Major.Minor.Patch+BuildNumber
version: 0.1.0+1

environment:
  # flutter create erzeugt ^3.11.1; ^3.9.0 reicht (go_router 17 braucht >=3.9.0)
  sdk: ^3.9.0
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter

  # ─── State Management ──────────────────────────────────────────────────────
  # flutter_riverpod: Flutter-spezifischer Wrapper um riverpod.
  # riverpod_annotation: Stellt die @riverpod-Annotation für Code-Gen bereit.
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # ─── Routing ───────────────────────────────────────────────────────────────
  # go_router 17.x: StatefulShellRoute für persistente Bottom-Nav mit
  # unabhängigen Tab-Navigationsstapeln. Breaking Change in 17.0:
  # ShellRoute-Observer-Benachrichtigung ist jetzt standardmäßig aktiv.
  go_router: ^14.8.1

  # ─── Datenbank ─────────────────────────────────────────────────────────────
  # drift: typsicherer SQLite-Wrapper mit FTS5-Unterstützung und reaktiven Streams.
  # sqlite3: SQLite-Bindings für Dart. Version 2.x nutzt sqlite3_flutter_libs
  #   als transitive Abhängigkeit für die nativen Android/iOS-Binaries.
  # drift_flutter: Thin Wrapper, der NativeDatabase mit path_provider verdrahtet
  #   und die DB auf einem Hintergrund-Isolat öffnet (kein UI-Blocking).
  drift: ^2.23.1
  sqlite3: ^2.7.5
  drift_flutter: ^0.2.4

  # ─── Hilfspakete ───────────────────────────────────────────────────────────
  # uuid: Dart-native UUID-Generierung (v4), keine nativen Abhängigkeiten.
  uuid: ^4.5.1
  # intl: Datums- und Zahlenformatierung (z. B. im EntryCard-Zeitstempel).
  intl: ^0.20.2
  # path_provider: wird von drift_flutter zum Auffinden des Dokumenten-
  # verzeichnisses benötigt.
  path_provider: ^2.1.5
  # path: Dateipfad-Operationen (join, relative, extension) – genutzt in
  # AttachmentService und EntryCard für plattformunabhängige Pfadkonstruktion.
  path: ^1.9.0
  image_picker: ^1.2.2
  record: ^6.2.1
  # ─── Media-Wiedergabe ─────────────────────────────────────────────────────
  # media_kit: einheitlicher Audio/Video-Player (ersetzt just_audio).
  # media_kit_video: Video-Widget-Komponente.
  # media_kit_libs_video: Native Android/iOS-Bibliotheken (FFmpeg, libmpv).
  media_kit: ^1.1.11
  media_kit_video: ^1.2.4
  media_kit_libs_video: ^1.0.4
  # youtube_player_iframe: YouTube iFrame Player API (kein API-Key nötig).
  youtube_player_iframe: ^4.0.2
  # url_launcher: Externe Links + YouTube-App öffnen.
  url_launcher: ^6.3.1
  speech_to_text: ^7.4.0
  google_mlkit_text_recognition: ^0.15.1
  google_mlkit_language_id: ^0.13.1
  receive_sharing_intent: ^1.8.1
  http: ^1.6.0
  mime: ^2.0.0
  archive: ^3.6.1
  file_picker: ^8.3.7
  share_plus: ^10.0.2
  permission_handler: ^11.3.1
  metadata_god: ^1.1.0

  # ─── App-Sperre ───────────────────────────────────────────────────────────
  # local_auth: Biometrische Authentifizierung (Fingerabdruck, Gesicht, PIN-Fallback).
  # Erfordert FlutterFragmentActivity in MainActivity.kt.
  local_auth: ^2.3.0

  # ─── Benachrichtigungen & Zeitzone ────────────────────────────────────────
  # flutter_local_notifications: lokale Push-Benachrichtigungen für Erinnerungen
  #   und den wöchentlichen Rückblick (Phase 6).
  # timezone: IANA-Zeitzonen-Daten für zonedSchedule (exakt geplante Alarme).
  # flutter_timezone: liest die Geräte-Zeitzone aus (Android/iOS-Plattformkanal).
  flutter_local_notifications: ^18.0.0
  timezone: ^0.9.4
  flutter_timezone: ^5.0.2

  # ─── PDF-Export ───────────────────────────────────────────────────────────
  # pdf: typsichere PDF-Erstellung in reinem Dart (kein nativer Code nötig).
  pdf: ^3.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  # ─── Code-Generierung ──────────────────────────────────────────────────────
  # build_runner: Orchestriert alle Quell-Generatoren.
  # Ausführen mit: dart run build_runner build --delete-conflicting-outputs
  build_runner: ^2.4.15
  # drift_dev: Generiert Companion-Klassen, Query-Methoden und Migrations-Stubs.
  drift_dev: ^2.23.1
  # riverpod_generator: Generiert @riverpod-annotierten Provider-Boilerplate.
  riverpod_generator: ^2.6.5

flutter:
  uses-material-design: true
