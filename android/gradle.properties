org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# receive_sharing_intent 1.8.1 setzt Java-Ziel auf 1.8, Kotlin-Ziel auf 17.
# Dieses Property stuft den 'Inconsistent JVM-target compatibility'-Fehler
# auf eine Warnung herab, damit der Build nicht abbricht.
kotlin.jvm.target.validation.mode=warning
