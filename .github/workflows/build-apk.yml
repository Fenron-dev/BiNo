name: Build Debug APK

on:
  workflow_dispatch:
  push:
    branches: [main]

# Explizite Schreibrechte damit der Release-Schritt den Tag anlegen darf.
# Ohne diese Rechte schlägt softprops/action-gh-release mit exit code 1 fehl.
permissions:
  contents: write

jobs:
  build:
    name: Flutter Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Neueste stabile Flutter-Version – keine feste Versionsnummer,
      # damit der Build nicht bricht wenn ein Minor-Update erscheint.
      - name: Flutter einrichten
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter-Version anzeigen
        run: flutter --version

      - name: flutter pub get
        run: flutter pub get

      - name: build_runner (Code-Generierung)
        run: dart run build_runner build --delete-conflicting-outputs

      # split-per-abi: arm64-v8a für S21 FE, armeabi-v7a als Fallback.
      - name: flutter build apk
        run: flutter build apk --debug --split-per-abi

      - name: APK-Pfade prüfen
        run: ls -lh build/app/outputs/flutter-apk/

      - name: GitHub Release erstellen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-debug
          name: "Aktueller Debug-Build"
          body: |
            Automatisch erzeugter Debug-Build.

            **Installation auf dem Samsung Galaxy S21 FE:**
            1. `app-arm64-v8a-debug.apk` herunterladen
            2. Einstellungen → Apps → Sonderrechte → Unbekannte Apps installieren → erlauben
            3. APK antippen und installieren
          prerelease: true
          make_latest: false
          files: |
            build/app/outputs/flutter-apk/app-arm64-v8a-debug.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-debug.apk
