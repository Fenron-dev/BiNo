name: Build Debug APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    name: Flutter Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Flutter einrichten
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Android SDK Lizenzen akzeptieren
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      # Flutter 3.x benötigt einen spezifischen NDK der oft nicht vorinstalliert ist.
      # Hier: NDK-Version aus dem Flutter SDK auslesen und installieren falls fehlend.
      - name: Flutter NDK ermitteln und installieren
        run: |
          FLUTTER_ROOT=$(flutter root)
          echo "Flutter root: $FLUTTER_ROOT"

          # NDK-Version aus Flutter-Gradle-Plugin extrahieren
          NDK_VER=$(grep -rh 'ndkVersion' "$FLUTTER_ROOT/packages/flutter_tools/" 2>/dev/null \
            | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          echo "Flutter NDK-Version: ${NDK_VER:-nicht gefunden}"

          # Vorinstallierte NDKs anzeigen (Diagnose)
          echo "=== Vorinstallierte NDKs ==="
          ls "$ANDROID_HOME/ndk/" 2>/dev/null || echo "Keine NDKs"

          # NDK installieren falls nötig
          TARGET="${NDK_VER:-27.0.12077973}"
          if [ ! -d "$ANDROID_HOME/ndk/$TARGET" ]; then
            echo "Installiere NDK $TARGET ..."
            yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;$TARGET" 2>&1 | tail -3
          else
            echo "NDK $TARGET bereits vorhanden."
          fi

      - name: flutter pub get
        run: flutter pub get

      - name: build_runner
        run: dart run build_runner build --delete-conflicting-outputs

      # --verbose zeigt den vollständigen Gradle-Output falls der Build scheitert.
      - name: flutter build apk
        run: flutter build apk --debug --split-per-abi --verbose

      - name: APK-Pfade prüfen
        run: ls -lh build/app/outputs/flutter-apk/

      - name: APK als Artifact hochladen
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: build/app/outputs/flutter-apk/app-arm64-v8a-debug.apk
          retention-days: 7

      - name: GitHub Release erstellen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-debug
          name: "Aktueller Debug-Build"
          body: |
            Debug-Build für Samsung Galaxy S21 FE.

            **Installation:**
            1. `app-arm64-v8a-debug.apk` herunterladen
            2. Einstellungen → Apps → Sonderrechte → Unbekannte Apps installieren → erlauben
            3. APK antippen und installieren
          prerelease: true
          make_latest: false
          files: |
            build/app/outputs/flutter-apk/app-arm64-v8a-debug.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-debug.apk
