name: Build Debug APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    name: Flutter Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Flutter einrichten
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # ubuntu-latest hat Android SDK vorinstalliert unter $ANDROID_HOME.
      # Lizenzen müssen explizit akzeptiert werden, sonst bricht
      # flutter build apk mit "Android license status unknown" ab.
      # '|| true' verhindert Exit-Code 1 bei bereits akzeptierten Lizenzen.
      - name: Android SDK Lizenzen akzeptieren
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Flutter-Diagnose (Troubleshooting)
        run: flutter doctor -v
        continue-on-error: true

      - name: flutter pub get
        run: flutter pub get

      - name: build_runner (Code-Generierung)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: flutter build apk
        run: flutter build apk --debug --split-per-abi

      - name: APK-Pfade prüfen
        run: ls -lh build/app/outputs/flutter-apk/

      # Artifact-Upload als Fallback – APK ist auch ohne Release downloadbar.
      - name: APK als Artifact hochladen
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: build/app/outputs/flutter-apk/app-arm64-v8a-debug.apk
          retention-days: 7

      - name: GitHub Release erstellen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-debug
          name: "Aktueller Debug-Build"
          body: |
            Debug-Build für Samsung Galaxy S21 FE.

            **Installation:**
            1. `app-arm64-v8a-debug.apk` herunterladen
            2. Einstellungen → Apps → Sonderrechte → Unbekannte Apps installieren → erlauben
            3. APK antippen und installieren
          prerelease: true
          make_latest: false
          files: |
            build/app/outputs/flutter-apk/app-arm64-v8a-debug.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-debug.apk
