name: Build Debug APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    name: Flutter Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Flutter einrichten
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Android SDK Lizenzen + Plattformen installieren
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          # Flutter 3.41.x braucht compileSdk 35 oder 36 – auf dem Runner fehlen
          # diese Plattformen oft. build-tools werden für APK-Signierung benötigt.
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-36" \
            "platforms;android-35" \
            "build-tools;36.0.0" \
            "build-tools;35.0.0" || true
          echo "=== Installierte SDK-Plattformen ==="
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --list_installed 2>/dev/null | grep -E "platforms|build-tools" | head -20

      # 'flutter root' existiert nicht – Flutter-Pfad über 'which flutter' ermitteln.
      # continue-on-error: true damit ein Skript-Fehler nicht den Build blockiert.
      - name: Flutter NDK ermitteln und installieren
        continue-on-error: true
        run: |
          FLUTTER_BIN=$(which flutter)
          FLUTTER_ROOT=$(dirname $(dirname "$FLUTTER_BIN"))
          echo "Flutter root: $FLUTTER_ROOT"

          # NDK-Version aus Flutter-Gradle-Dateien extrahieren
          NDK_VER=$(find "$FLUTTER_ROOT/packages/flutter_tools" \
            \( -name "*.gradle" -o -name "*.kt" -o -name "*.groovy" \) 2>/dev/null \
            | xargs grep -h 'ndkVersion' 2>/dev/null \
            | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)

          echo "=== Vorinstallierte NDKs ==="
          ls "$ANDROID_HOME/ndk/" 2>/dev/null || echo "Keine NDKs vorhanden"

          TARGET="${NDK_VER:-27.0.12077973}"
          echo "Ziel-NDK: $TARGET"

          if [ ! -d "$ANDROID_HOME/ndk/$TARGET" ]; then
            echo "Installiere NDK $TARGET ..."
            yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;$TARGET" 2>&1 | tail -5
          else
            echo "NDK $TARGET ist bereits vorhanden."
          fi

      - name: flutter pub get
        run: flutter pub get

      - name: build_runner
        run: dart run build_runner build --delete-conflicting-outputs

      # Bei Fehler: gefilterte Fehlerzeilen am Ende ausgeben → direkt sichtbar im Log.
      - name: flutter build apk
        run: |
          flutter build apk --debug --split-per-abi 2>&1 | tee /tmp/build.log
          EXIT=${PIPESTATUS[0]}
          if [ $EXIT -ne 0 ]; then
            echo ""
            echo "════════════ GRADLE FEHLER (gefiltert) ════════════"
            grep -E "FAILURE:|BUILD FAILED|Execution failed|> Task|error:|Could not|Exception" \
              /tmp/build.log | grep -v "^$" | head -40
            echo "════════════════════════════════════════════════════"
            exit $EXIT
          fi

      - name: APK-Pfade prüfen
        run: ls -lh build/app/outputs/flutter-apk/

      - name: APK als Artifact hochladen
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: build/app/outputs/flutter-apk/app-arm64-v8a-debug.apk
          retention-days: 7

      - name: Alten Release löschen (falls vorhanden)
        run: gh release delete latest-debug --yes --cleanup-tag 2>/dev/null || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: GitHub Release erstellen
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: latest-debug
          name: "Aktueller Debug-Build"
          body: |
            Debug-Build für Samsung Galaxy S21 FE.

            **Installation:**
            1. `app-arm64-v8a-debug.apk` herunterladen
            2. Einstellungen → Apps → Sonderrechte → Unbekannte Apps installieren → erlauben
            3. APK antippen und installieren
          prerelease: true
          make_latest: false
          files: |
            build/app/outputs/flutter-apk/app-arm64-v8a-debug.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-debug.apk
